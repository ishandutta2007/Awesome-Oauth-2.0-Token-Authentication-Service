<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatParticleSlow {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-16px) translateX(12px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes floatParticleFast {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-24px) translateX(-18px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes tokenBeam {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(380px); opacity: 0; }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56,189,248,0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(99,102,241,0.7)); }
    }

    .pulse-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .float-slow { animation: floatParticleSlow 7s ease-in-out infinite; }
    .float-fast { animation: floatParticleFast 5s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 8 6; animation: dashTravel 20s linear infinite; }
    .badge-animated { animation: badgeGlow 4s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glow Orbs in Background (Never blocking text) -->
  <circle cx="200" cy="90" r="140" fill="url(#glowGrad)" class="pulse-glow" filter="url(#glowEffect)" />
  <circle cx="1020" cy="330" r="160" fill="url(#glowGrad)" class="pulse-glow" filter="url(#glowEffect)" />

  <!-- Animated Flow Lines in lower right background -->
  <g opacity="0.35">
    <path d="M 680,360 C 800,320 950,400 1120,350" fill="none" stroke="#38bdf8" stroke-width="2.5" class="dash-line" />
    <path d="M 720,380 C 840,340 980,410 1150,370" fill="none" stroke="#818cf8" stroke-width="2" class="dash-line" />
  </g>

  <!-- Floating Decorative Nodes (Background Layer) -->
  <g class="float-slow" opacity="0.6">
    <circle cx="100" cy="310" r="4" fill="#38bdf8" />
    <circle cx="1120" cy="110" r="5" fill="#818cf8" />
    <circle cx="620" cy="50" r="3.5" fill="#34d399" />
  </g>
  <g class="float-fast" opacity="0.7">
    <circle cx="1050" cy="80" r="3" fill="#f472b6" />
    <circle cx="180" cy="360" r="4.5" fill="#38bdf8" />
    <circle cx="980" cy="220" r="3.5" fill="#a78bfa" />
  </g>

  <!-- Interactive Protocol Badge Pill (Upper Left / Center) -->
  <g transform="translate(60, 48)">
    <rect width="270" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2" class="badge-animated" />
    <circle cx="20" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.2">OAUTH 2.0 • OIDC • TOKEN IAM</text>
  </g>

  <!-- Main Headline Title (Crisp Foreground, High Contrast, Perfectly Legible) -->
  <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Awesome OAuth 2.0 &amp; Token
  </text>
  <text x="60" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
    Authentication Service
  </text>

  <!-- Subtitle / Value Proposition Description -->
  <text x="60" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
    Curated directory of top-tier SaaS solutions and battle-tested open-source token engines.
  </text>
  <text x="60" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">
    PKCE • JWT • MTLS • RFC 8693 Token Exchange • Passkeys • OpenID Connect Provider
  </text>

  <!-- Feature Metric Pills Row -->
  <g transform="translate(60, 315)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">☁️ Enterprise SaaS</text>
    </g>

    <!-- Pill 2: Open Source Stars -->
    <g transform="translate(195, 0)">
      <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">⭐ Top Open-Source</text>
    </g>

    <!-- Pill 3: Benchmarks & TCO -->
    <g transform="translate(405, 0)">
      <rect width="205" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">📊 Pricing &amp; Limits</text>
    </g>
  </g>

  <!-- Graphic Diagram: Token Flow Illustration on the Right -->
  <g transform="translate(850, 100)" filter="url(#shadow)">
    <!-- Shield / Token Server Icon Card -->
    <rect x="0" y="0" width="280" height="190" rx="16" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    
    <!-- Code Window Dots -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />
    
    <!-- Shield Icon -->
    <g transform="translate(116, 42)">
      <circle cx="24" cy="24" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 24,10 L 37,16 V 26 C 37,34 24,40 24,40 C 24,40 11,34 11,26 V 16 Z" fill="url(#tokenGrad)" />
      <path d="M 21,24 L 24,27 L 29,20" fill="none" stroke="#090d16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Token Verification Line Graphic -->
    <g transform="translate(24, 115)">
      <rect width="232" height="26" rx="6" fill="#1e293b" />
      <text x="12" y="17" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">access_token: eyJhbGciOi...</text>
      <rect x="194" y="5" width="28" height="16" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
      <text x="199" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#34d399">200</text>
    </g>

    <text x="140" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">
      Standards-Compliant RFC 6749 / 8693
    </text>
  </g>
</svg>
